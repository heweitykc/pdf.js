<!-- 水印背景设置对话框 -->
<div id="watermarkBackgroundDialog" class="dialog">
  <div class="dialogContainer">
    <div class="dialogHeader">
      <h2>水印背景设置</h2>
      <button id="watermarkBackgroundDialogClose" class="dialogCloseButton" title="关闭">
        <span>×</span>
      </button>
    </div>
    
    <div class="dialogContent">
      <div class="watermarkSection">
        <label class="watermarkCheckbox">
          <input type="checkbox" id="watermarkEnable">
          <span>启用水印背景</span>
        </label>
      </div>

      <div class="watermarkSection">
        <label for="watermarkType">水印类型：</label>
        <select id="watermarkType">
          <option value="text">文字水印</option>
          <option value="image">图片水印</option>
        </select>
      </div>

      <!-- 文字水印设置 -->
      <div id="textWatermarkSection" class="watermarkSection">
        <label for="watermarkText">水印文字：</label>
        <input type="text" id="watermarkText" placeholder="请输入水印文字" value="机密文件">
      </div>

      <!-- 图片水印设置 -->
      <div id="imageWatermarkSection" class="watermarkSection" style="display: none;">
        <label for="watermarkImage">选择图片：</label>
        <input type="file" id="watermarkImage" accept="image/*">
        <div class="watermarkImagePreview" id="watermarkImagePreview"></div>
      </div>

      <!-- 通用设置 -->
      <div class="watermarkSection">
        <label for="watermarkOpacity">透明度：</label>
        <input type="range" id="watermarkOpacity" min="0" max="1" step="0.1" value="0.3">
        <span id="watermarkOpacityValue">0.3</span>
      </div>

      <div class="watermarkSection">
        <label for="watermarkRotation">旋转角度：</label>
        <input type="range" id="watermarkRotation" min="-180" max="180" step="5" value="-45">
        <span id="watermarkRotationValue">-45°</span>
      </div>

      <div class="watermarkSection">
        <label for="watermarkScale">缩放比例：</label>
        <input type="range" id="watermarkScale" min="0.1" max="3" step="0.1" value="1.0">
        <span id="watermarkScaleValue">1.0</span>
      </div>

      <div class="watermarkSection">
        <label for="watermarkSpacing">水印间距：</label>
        <input type="range" id="watermarkSpacing" min="50" max="500" step="10" value="200">
        <span id="watermarkSpacingValue">200px</span>
      </div>

      <!-- 预览区域 -->
      <div class="watermarkSection">
        <label>预览：</label>
        <div class="watermarkPreview" id="watermarkPreview">
          <canvas id="watermarkPreviewCanvas" width="300" height="200"></canvas>
        </div>
      </div>
    </div>

    <div class="dialogFooter">
      <button id="watermarkApply" class="dialogButton primary">应用</button>
      <button id="watermarkClear" class="dialogButton">清除</button>
      <button id="watermarkCancel" class="dialogButton">取消</button>
    </div>
  </div>
</div>

<style>
.watermarkSection {
  margin-bottom: 15px;
}

.watermarkSection label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
}

.watermarkSection input[type="text"],
.watermarkSection input[type="file"],
.watermarkSection select {
  width: 100%;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.watermarkSection input[type="range"] {
  width: 60%;
  margin-right: 10px;
}

.watermarkCheckbox {
  display: flex;
  align-items: center;
  gap: 8px;
}

.watermarkCheckbox input[type="checkbox"] {
  margin: 0;
}

.watermarkImagePreview {
  margin-top: 10px;
  max-width: 200px;
  max-height: 150px;
  border: 1px solid #ccc;
  border-radius: 4px;
  overflow: hidden;
}

.watermarkImagePreview img {
  width: 100%;
  height: auto;
}

.watermarkPreview {
  border: 1px solid #ccc;
  border-radius: 4px;
  padding: 10px;
  background: #f9f9f9;
}

#watermarkPreviewCanvas {
  border: 1px solid #ddd;
  background: white;
}
</style>
